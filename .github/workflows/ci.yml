name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  state-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run state durability tests
        run: |
          cd "${GITHUB_WORKSPACE%/*}"
          python -m pytest uaw/tests/test_state_durability.py uaw/tests/test_idempotency.py uaw/tests/test_policy_verification.py -q
